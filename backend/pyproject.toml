[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(\.venv|alembic/versions)/
'''

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
exclude = ['.venv', 'alembic/versions']

# Celery and kombu ship no type information.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

# Pygments ships no type information.
[[tool.mypy.overrides]]
module = ["pygments", "pygments.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
# SQLAlchemy's async layer runs on greenlets; without this, lines after an await can go unseen.
concurrency = ["greenlet", "thread"]
